{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नयाँ वर्षको शुभकामना</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .image-container {
            width: 100%;
            max-width: 1080px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-continue {
            margin-top: 24px;
            padding: 14px 40px;
            background-color: #c0392b;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        .btn-continue:hover {
            background-color: #a93226;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="{% static 'images/newyear.jpg' %}" alt="New Year Greetings">
    </div>
    <a href="{% url 'home' %}" class="btn-continue">Continue to Website &rarr;</a>
</body>
</html>
